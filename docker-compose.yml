version: '3.9'

services:
  # ─────────────────────────────────────────────
  # PostgreSQL 16
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: helpmytravel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpmytravel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: helpmytravel_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ─────────────────────────────────────────────
  # API (NestJS) — optional, only for full stack dev
  # Comment out if running API locally with `pnpm dev`
  # ─────────────────────────────────────────────
  # api:
  #   build:
  #     context: .
  #     dockerfile: apps/api/Dockerfile
  #   container_name: helpmytravel_api
  #   restart: unless-stopped
  #   ports:
  #     - '3001:3001'
  #   environment:
  #     DATABASE_URL: postgresql://postgres:postgres@postgres:5432/helpmytravel
  #     REDIS_URL: redis://redis:6379
  #   env_file: .env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
  redis_data:
