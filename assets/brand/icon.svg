<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#F7567C"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667EEA"/>
      <stop offset="100%" stop-color="#764BA2"/>
    </linearGradient>
    <filter id="s">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#FF6B35" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg)" filter="url(#s)"/>

  <!-- Map pin -->
  <path d="M50 14 C37 14 26 25 26 38 C26 55 50 78 50 78 C50 78 74 55 74 38 C74 25 63 14 50 14Z"
        fill="white" opacity="0.95"/>

  <!-- Fork & knife inside pin -->
  <g transform="translate(37.5, 25)">
    <!-- Fork tines -->
    <rect x="1" y="0" width="2.2" height="8" rx="1.1" fill="#FF6B35"/>
    <rect x="4.9" y="0" width="2.2" height="8" rx="1.1" fill="#FF6B35"/>
    <rect x="8.8" y="0" width="2.2" height="8" rx="1.1" fill="#FF6B35"/>
    <!-- Fork handle -->
    <rect x="4.4" y="8" width="3" height="11" rx="1.5" fill="#FF6B35"/>
    <!-- Knife -->
    <path d="M14.5 0 C14.5 0 18.5 2 18.5 7 L18.5 19 L16.5 19 L16.5 7 C16.5 3.5 14.5 2 14.5 0Z"
          fill="#F7567C"/>
  </g>

  <!-- Translation bubble (top-right corner) -->
  <g transform="translate(61, 8)">
    <rect x="0" y="0" width="26" height="19" rx="9.5" fill="url(#bubble)"/>
    <path d="M7 19 L4 24 L14 19Z" fill="url(#bubble)"/>
    <text x="13" y="14" font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="11" font-weight="bold" text-anchor="middle" fill="white">文A</text>
  </g>
</svg>
