<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <defs>
    <!-- Main gradient: orange → coral → pink -->
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#F7567C"/>
    </linearGradient>
    <!-- Bubble gradient -->
    <linearGradient id="bubbleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667EEA"/>
      <stop offset="100%" stop-color="#764BA2"/>
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#16213E"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF6B35" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ======== ICON MARK ======== -->
  <!-- Map pin body -->
  <path d="M55 10 C38 10 24 24 24 41 C24 62 55 95 55 95 C55 95 86 62 86 41 C86 24 72 10 55 10Z"
        fill="url(#pinGrad)" filter="url(#shadow)"/>

  <!-- Pin inner circle (white) -->
  <circle cx="55" cy="40" r="18" fill="white" opacity="0.95"/>

  <!-- Fork icon inside pin -->
  <g transform="translate(44, 29)">
    <!-- Fork left tine -->
    <rect x="2" y="0" width="2" height="9" rx="1" fill="#FF6B35"/>
    <!-- Fork middle tine -->
    <rect x="5.5" y="0" width="2" height="9" rx="1" fill="#FF6B35"/>
    <!-- Fork right tine -->
    <rect x="9" y="0" width="2" height="9" rx="1" fill="#FF6B35"/>
    <!-- Fork handle -->
    <rect x="5" y="9" width="3" height="13" rx="1.5" fill="#FF6B35"/>
    <!-- Knife right side -->
    <path d="M15 0 C15 0 19 2 19 8 L19 22 L17 22 L17 8 C17 4 15 2 15 0Z" fill="#F7567C"/>
  </g>

  <!-- Translation bubble (small, top right of pin) -->
  <g transform="translate(69, 5)" filter="url(#glow)">
    <rect x="0" y="0" width="22" height="16" rx="8" fill="url(#bubbleGrad)"/>
    <!-- Bubble tail -->
    <path d="M6 16 L3 20 L12 16Z" fill="url(#bubbleGrad)"/>
    <!-- "A" symbol inside bubble (multilingual hint) -->
    <text x="11" y="12" font-family="Georgia, serif" font-size="10" font-weight="bold"
          text-anchor="middle" fill="white">文</text>
  </g>

  <!-- ======== WORDMARK ======== -->
  <!-- "Help My" in dark navy -->
  <text x="106" y="55"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="34"
        font-weight="700"
        letter-spacing="-0.5"
        fill="#1A1A2E">Help My</text>

  <!-- "Travel" in gradient orange -->
  <text x="106" y="55"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="34"
        font-weight="700"
        letter-spacing="-0.5"
        fill="url(#pinGrad)">
    <tspan x="253" dy="0">Travel</tspan>
  </text>

  <!-- Tagline: "Menus translated. Everywhere." -->
  <text x="107" y="78"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="13"
        font-weight="400"
        letter-spacing="1.5"
        fill="#888CA0">MENUS TRANSLATED. EVERYWHERE.</text>

  <!-- Subtle separator line under wordmark -->
  <line x1="106" y1="84" x2="430" y2="84" stroke="#FF6B35" stroke-width="1.5" stroke-opacity="0.3"/>
</svg>
