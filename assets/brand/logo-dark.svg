<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <defs>
    <linearGradient id="pinGradD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#F7567C"/>
    </linearGradient>
    <linearGradient id="bubbleGradD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667EEA"/>
      <stop offset="100%" stop-color="#764BA2"/>
    </linearGradient>
    <filter id="glowD">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadowD">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF6B35" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Map pin body -->
  <path d="M55 10 C38 10 24 24 24 41 C24 62 55 95 55 95 C55 95 86 62 86 41 C86 24 72 10 55 10Z"
        fill="url(#pinGradD)" filter="url(#shadowD)"/>

  <!-- Pin inner circle -->
  <circle cx="55" cy="40" r="18" fill="#0F0E17" opacity="0.85"/>

  <!-- Fork & knife inside pin (white on dark) -->
  <g transform="translate(44, 29)">
    <rect x="2" y="0" width="2" height="9" rx="1" fill="white"/>
    <rect x="5.5" y="0" width="2" height="9" rx="1" fill="white"/>
    <rect x="9" y="0" width="2" height="9" rx="1" fill="white"/>
    <rect x="5" y="9" width="3" height="13" rx="1.5" fill="white"/>
    <path d="M15 0 C15 0 19 2 19 8 L19 22 L17 22 L17 8 C17 4 15 2 15 0Z" fill="rgba(255,255,255,0.7)"/>
  </g>

  <!-- Translation bubble -->
  <g transform="translate(69, 5)" filter="url(#glowD)">
    <rect x="0" y="0" width="22" height="16" rx="8" fill="url(#bubbleGradD)"/>
    <path d="M6 16 L3 20 L12 16Z" fill="url(#bubbleGradD)"/>
    <text x="11" y="12" font-family="Georgia, serif" font-size="10" font-weight="bold"
          text-anchor="middle" fill="white">文</text>
  </g>

  <!-- Wordmark (light for dark bg) -->
  <text x="106" y="55"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="34" font-weight="700" letter-spacing="-0.5"
        fill="white">Help My</text>

  <text x="253" y="55"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="34" font-weight="700" letter-spacing="-0.5"
        fill="url(#pinGradD)">Travel</text>

  <text x="107" y="78"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="400" letter-spacing="1.5"
        fill="rgba(255,255,255,0.45)">MENUS TRANSLATED. EVERYWHERE.</text>

  <line x1="106" y1="84" x2="430" y2="84" stroke="#FF6B35" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>
